  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ic */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d82eb47b-f534-4590-b125-b02abc600b0d\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"1216ba0d-8c47-4066-8345-71097bc7abea\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"f4c3a950-5fca-4c38-84b2-39474e226144\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Playfair Display';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"7cddfe6a-e60e-473f-bd44-0fc2dfdb5606\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n  <style>\n    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n    :root {\n      --navy-deep: #0f1a2e; --navy: #1a2744; --red: #b91c1c; --red-bright: #dc2626;\n      --white: #ffffff; --gray-50: #f8f7f5; --gray-100: #eeecea;\n      --gray-400: #9ca3af; --gray-600: #4b5563; --gray-800: #1f2937;\n      --green: #16a34a; --amber: #d97706; --blue: #2563eb; --purple: #7c3aed;\n    }\n    body { font-family: 'DM Sans', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }\n\n    /* NAV */\n    .top-nav { height: 64px; background: var(--white); border-bottom: 1px solid rgba(26,39,68,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; position: fixed; top: 0; left: 0; right: 0; z-index: 200; }\n    .nav-left { display: flex; align-items: center; gap: 16px; }\n    .hamburger-btn { background: none; border: none; cursor: pointer; padding: 6px; display: flex; flex-direction: column; gap: 5px; border-radius: 6px; transition: background 150ms; }\n    .hamburger-btn:hover { background: var(--gray-50); }\n    .hamburger-btn span { display: block; width: 22px; height: 2px; background: var(--navy); border-radius: 2px; }\n    .nav-logo { height: 32px; }\n    .nav-center { font-size: 12px; font-weight: 500; color: var(--gray-400); }\n    .nav-right { display: flex; align-items: center; gap: 12px; }\n    .supplier-label { font-size: 11px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.1em; text-transform: uppercase; }\n    .avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--navy); color: white; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center; cursor: pointer; }\n\n    /* SIDE NAV */\n    .side-nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 250ms ease; }\n    .side-nav-overlay.open { opacity: 1; pointer-events: all; }\n    .side-nav { position: fixed; top: 0; left: 0; bottom: 0; width: 280px; background: var(--navy-deep); z-index: 400; transform: translateX(-100%); transition: transform 300ms cubic-bezier(0.16,1,0.3,1); display: flex; flex-direction: column; }\n    .side-nav.open { transform: translateX(0); }\n    .side-nav-header { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.08); }\n    .side-nav-logo { height: 28px; filter: brightness(0) invert(1); }\n    .close-btn { background: none; border: none; color: rgba(255,255,255,0.6); cursor: pointer; font-size: 24px; line-height: 1; padding: 4px; }\n    .close-btn:hover { color: white; }\n    .side-nav-items { flex: 1; padding: 16px 0; }\n    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: rgba(255,255,255,0.7); font-size: 15px; font-weight: 500; text-decoration: none; transition: all 150ms; border-left: 3px solid transparent; }\n    .nav-item:hover { color: white; background: rgba(255,255,255,0.05); }\n    .nav-item.active { color: white; border-left-color: var(--red); background: rgba(255,255,255,0.04); }\n    .nav-item-icon { width: 20px; height: 20px; opacity: 0.8; flex-shrink: 0; }\n    .nav-badge { margin-left: auto; background: var(--red); color: white; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }\n    .side-nav-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.08); }\n    .elfa-nav-btn { width: 100%; padding: 11px 16px; background: transparent; border: 1.5px solid var(--red); color: var(--red); border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 150ms; }\n    .elfa-nav-btn:hover { background: rgba(185,28,28,0.08); }\n\n    /* MAIN */\n    .main { padding-top: 64px; }\n    .page-content { max-width: 900px; margin: 0 auto; padding: 40px 4% 80px; }\n    .page-eyebrow { font-size: 11px; font-weight: 600; color: var(--red); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 6px; }\n    .page-title { font-family: 'Playfair Display', serif; font-size: 30px; font-weight: 700; color: var(--navy); line-height: 1.2; margin-bottom: 28px; }\n\n    /* BALANCE CARD */\n    .balance-card { background: var(--white); border: 1px solid rgba(26,39,68,0.10); border-radius: 14px; padding: 32px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 24px; }\n    .balance-left { }\n    .balance-label-text { font-size: 11px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 8px; }\n    .balance-number { font-family: 'Playfair Display', serif; font-size: 72px; font-weight: 700; color: var(--navy); line-height: 1; }\n    .balance-value { font-size: 14px; color: var(--gray-400); margin-top: 6px; }\n    .balance-pricing-note { font-size: 12px; color: var(--gray-400); margin-top: 12px; line-height: 1.6; }\n    .balance-pricing-note strong { color: var(--gray-600); }\n    .btn-topup { padding: 14px 28px; background: var(--red); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 150ms; white-space: nowrap; }\n    .btn-topup:hover { background: var(--red-bright); }\n\n    /* TRANSACTION TABLE */\n    .section-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--navy); margin-bottom: 16px; }\n    .table-wrap { background: var(--white); border: 1px solid rgba(26,39,68,0.10); border-radius: 12px; overflow: hidden; }\n    table { width: 100%; border-collapse: collapse; }\n    th { font-size: 11px; font-weight: 600; color: var(--gray-400); letter-spacing: 0.08em; text-transform: uppercase; padding: 12px 20px; text-align: left; border-bottom: 1px solid rgba(26,39,68,0.08); background: var(--gray-50); }\n    td { font-size: 13px; color: var(--gray-800); padding: 14px 20px; border-bottom: 1px solid rgba(26,39,68,0.06); vertical-align: middle; }\n    tr:last-child td { border-bottom: none; }\n    tr:hover td { background: rgba(26,39,68,0.02); }\n    .tx-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 4px; letter-spacing: 0.04em; display: inline-flex; align-items: center; gap: 5px; }\n    .tx-topup { background: rgba(22,16 nd: rgba(22,163,74,0.12); color: #15803d; border: 1px solid rgba(22,163,74,0.2); }\n    .pkg-badge.navy { background: var(--navy); color: white; }\n    .pkg-credits { font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 700; color: var(--navy); line-height: 1; margin-bottom: 2px; }\n    .pkg-credits-label { font-size: 12px; color: var(--gray-400); margin-bottom: 12px; }\n    .pkg-price { font-size: 20px; font-weight: 700; color: var(--navy); margin-bottom: 2px; }\n    .pkg-per { font-size: 12px; color: var(--gray-400); }\n    .pkg-divider { width: 32px; height: 1px; background: var(--gray-100); margin: 12px auto; }\n\n    /* STRIPE INPUT */\n    .stripe-section { margin-bottom: 20px; }\n    .stripe-label { font-size: 13px; font-weight: 600; color: var(--gray-800); margin-bottom: 8px; display: block; }\n    .stripe-input-mock { background: var(--white); border: 1px solid rgba(26,39,68,0.20); border-radius: 7px; height: 44px; display: flex; align-items: center; padding: 0 14px; gap: 10px; }\n    .stripe-card-icon { width: 30px; height: 20px; border-radius: 3px; background: linear-gradient(135deg, #1a1f71 50%, #f79e1b 50%); flex-shrink: 0; }\n    .stripe-placeholder { font-size: 14px; color: var(--gray-400); letter-spacing: 0.12em; }\n    .stripe-expiry-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }\n    .stripe-input-mock.small { height: 40px; }\n\n    /* TOTAL + PAY */\n    .total-box { background: var(--gray-50); border: 1px solid var(--gray-100); border-radius: 8px; padding: 14px 16px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }\n    .total-label { font-size: 14px; font-weight: 600; color: var(--gray-800); }\n    .total-amount { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--navy); }\n    .btn-pay { width: 100%; padding: 14px; background: var(--red); color: white; border: none; border-radius: 7px; font-family: 'DM Sans', sans tClass = 'tx-credit-pos';\n      } else if (tx.type === 'connection') {\n        badgeClass = 'tx-connection'; badgeText = 'Connection';\n        creditText = `${tx.credits}`; creditClass = 'tx-credit-neg';\n      } else if (tx.type === 'reserved') {\n        badgeClass = 'tx-reserved'; badgeText = 'Reserved';\n        creditText = `${tx.credits} reserved`; creditClass = 'tx-credit-amber';\n      } else {\n        badgeClass = 'tx-refunded'; badgeText = 'Refunded';\n        creditText = `+${tx.credits}`; creditClass = 'tx-credit-pos';\n      }\n      return `<tr>\n        <td style=\"color:var(--gray-600);font-size:12px;\">${tx.date}<\u002Ftd>\n        <td><span class=\"tx-badge ${badgeClass}\">${badgeText}<\u002Fspan><\u002Ftd>\n        <td class=\"${creditClass}\">${creditText}<\u002Ftd>\n        <td class=\"tx-related\">${tx.related}<\u002Ftd>\n        <td class=\"tx-balance\">${tx.balance}<\u002Ftd>\n      <\u002Ftr>`;\n    }).join('');\n  }\n\n  function updateBalanceDisplay() {\n    document.getElementById('balanceDisplay').textContent = balance;\n    document.getElementById('balanceValue').textContent = `≈ US$${balance * 138} value`;\n  }\n\n  function openTopUp() {\n    document.getElementById('topUpModal').classList.add('open');\n  }\n  function closeTopUp() {\n    document.getElementById('topUpModal').classList.remove('open');\n  }\n\n  function selectPkg(credits, price) {\n    selectedPkg = { credits, price };\n    document.querySelectorAll('.pkg-card').forEach(c => c.classList.remove('selected'));\n    document.getElementById(`pkg-${credits}`).classList.add('selected');\n    document.getElementById('totalAmount').textContent = `US$${price}`;\n    document.getElementById('payBtn').textContent = `Pay US$${price} →`;\n  }\n\n  function confirmPayment() {\n    closeTopUp();\n    balance += selectedPkg.credits;\n    updateBalanceDisplay();\n    // Add to transaction history\n    const today = '28 Apr 2026';\n    transactions.unshift({\n      date: today,\n <script>
(async function() {
  const SE = window.SourcingElf;
  SE.RouteGuard.requireSupplier();

  await new Promise(r => setTimeout(r, 500));

  try {
    const credits = await SE.CreditsAPI.getMyCredits();
    const transactions = await SE.CreditsAPI.getMyTransactions();

    // Update balance display
    const balanceEls = document.querySelectorAll('.metric-number, .balance-number, .credits-balance');
    balanceEls.forEach(el => {
      if (el.textContent.trim().match(/^\d+$/)) {
        el.textContent = credits.balance;
      }
    });

    console.log('Credits loaded:', credits, 'Transactions:', transactions.length);

    // Top Up buttons
    document.querySelectorAll('[data-package]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const pkg = btn.dataset.package;
        try {
          await SE.CreditsAPI.redirectToCheckout(pkg);
        } catch(e) {
          SE.NotificationHelper.error('Failed to start checkout. Please try again.');
        }
      });
    });

  } catch(e) {
    console.error('Credits load error:', e);
    SE.NotificationHelper.error('Failed to load credits data.');
  }
})();
</script>
