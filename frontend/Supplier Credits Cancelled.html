<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Cancelled - SourcingElf</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(180deg, #fafaf7 0%, #f5f3ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1a2744;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(26, 39, 68, 0.08);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(156, 163, 175, 0.15);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrap svg { stroke: #6b7280; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-row { display: flex; gap: 12px; justify-content: center; }
    .btn {
      display: inline-block;
      padding: 11px 24px;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
    }
    .btn-primary { background: #b91c1c; color: #fff; }
    .btn-secondary {
      background: #fff;
      color: #1a2744;
      border: 1.5px solid rgba(26, 39, 68, 0.2);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </div>
    <h1>Payment Cancelled</h1>
    <p>No charge was made. You can try again whenever you&rsquo;re ready.</p>
    <div class="btn-row">
      <a class="btn btn-primary" href="/credits">Back to Credits</a>
      <a class="btn btn-secondary" href="/dashboard">Dashboard</a>
    </div>
  </div>
</body>
</html>
