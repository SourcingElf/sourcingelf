<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Successful - SourcingElf</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: linear-gradient(180deg, #fafaf7 0%, #f5f3ee 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #1a2744;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(26, 39, 68, 0.08);
    }
    .icon-wrap {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(22, 163, 74, 0.1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
    }
    .icon-wrap svg { stroke: #16a34a; }
    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 15px;
      color: #4b5563;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .countdown {
      font-size: 13px;
      color: #9ca3af;
      margin-top: 24px;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 11px 28px;
      background: #b91c1c;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h1>Payment Successful</h1>
    <p>Your credits have been added to your account.</p>
    <p class="countdown">Redirecting to Credits in <span id="countdown">3</span> seconds&hellip;</p>
    <a class="btn" href="/credits">Go to Credits now</a>
  </div>
  <script>
    var n = 3;
    var el = document.getElementById('countdown');
    var t = setInterval(function() {
      n--;
      if (el) el.textContent = n;
      if (n <= 0) {
        clearInterval(t);
        window.location.href = '/credits';
      }
    }, 1000);
  </script>
</body>
</html>
